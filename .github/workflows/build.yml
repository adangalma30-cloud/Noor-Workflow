name: Build Noor APK

on:
  workflow_dispatch:
    inputs:
      app_ref:
        description: "Noor branch, tag, or commit to build"
        required: false
        default: "main"
        type: string
      build_type:
        description: "APK build type"
        required: false
        default: "debug"
        type: choice
        options:
          - debug
          - release
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build Android ${{ inputs.build_type || 'debug' }} APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out Noor
        uses: actions/checkout@v4
        with:
          repository: adangalma30-cloud/Noor
          ref: ${{ inputs.app_ref || 'main' }}
          path: noor

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          # Cache on the lockfile so the key changes only when deps change.
          cache-dependency-path: noor/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          # Expo SDK 58 / Gradle 9 build with JDK 21.
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-37" "platforms;android-36" "build-tools;37.0.0"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('noor/package-lock.json') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Install Noor dependencies
        working-directory: noor
        run: npm ci

      - name: Generate Android project (Expo prebuild)
        working-directory: noor
        env:
          CI: "true"
          EXPO_NO_TELEMETRY: "1"
        run: npx expo prebuild -p android --no-install

      - name: Make Gradle wrapper executable
        working-directory: noor/android
        run: chmod +x gradlew

      - name: Build APK
        working-directory: noor/android
        run: |
          if [ "${{ inputs.build_type || 'debug' }}" = "release" ]; then
            ./gradlew assembleRelease --no-daemon --stacktrace
          else
            ./gradlew assembleDebug --no-daemon --stacktrace
          fi

      - name: Locate APK
        id: apk
        working-directory: noor/android
        run: |
          APK_PATH=$(find app/build/outputs/apk -name "*.apk" | head -1)
          if [ -z "$APK_PATH" ]; then
            echo "No APK was produced." >&2
            exit 1
          fi
          echo "path=noor/android/$APK_PATH" >> "$GITHUB_OUTPUT"
          echo "Built $APK_PATH ($(du -h "$APK_PATH" | cut -f1))"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: noor-${{ inputs.build_type || 'debug' }}-apk
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 14

      - name: Upload Gradle reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-reports
          path: noor/android/app/build/reports/
          if-no-files-found: ignore
          retention-days: 7
